services:
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: nextick-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT_INTERNAL://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT_INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms512M"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 2
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    stop_grace_period: 30s
    networks:
      - nextick_net
    volumes:
      - kafka_data:/var/lib/kafka/data
    
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nextick-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: NexTick-Local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - nextick_net
    depends_on:
      kafka:
        condition: service_healthy

  kafka-setup:
    image: confluentinc/cp-kafka:7.4.0
    container_name: nextick-kafka-setup
    env_file:
      - data_pipeline/.env
    environment:
      - KAFKA_BROKER=kafka:29092
    command: |
      bash -ec '
        : "$${KAFKA_BROKER:?KAFKA_BROKER is required}"
        : "$${KAFKA_TOPIC_RAW_TRADES:?KAFKA_TOPIC_RAW_TRADES is required}"
        : "$${KAFKA_TOPIC_KLINE_STREAM:?KAFKA_TOPIC_KLINE_STREAM is required}"

        for attempt in $$(seq 1 30); do
          if kafka-topics --bootstrap-server "$${KAFKA_BROKER}" --list >/dev/null 2>&1; then
            break
          fi

          if [ "$${attempt}" -eq 30 ]; then
            echo "Kafka did not become ready after $${attempt} attempts" >&2
            exit 1
          fi

          echo "Waiting for Kafka API... ($${attempt}/30)"
          sleep 5
        done

        kafka-topics --bootstrap-server "$${KAFKA_BROKER}" --create --if-not-exists --topic "$${KAFKA_TOPIC_RAW_TRADES}" --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server "$${KAFKA_BROKER}" --create --if-not-exists --topic "$${KAFKA_TOPIC_KLINE_STREAM}" --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server "$${KAFKA_BROKER}" --describe --topic "$${KAFKA_TOPIC_RAW_TRADES}"
        kafka-topics --bootstrap-server "$${KAFKA_BROKER}" --describe --topic "$${KAFKA_TOPIC_KLINE_STREAM}"
      '
    networks:
      - nextick_net
    depends_on:
      kafka:
        condition: service_healthy

  questdb:
    image: questdb/questdb:latest
    container_name: nextick-questdb
    ports:
      - "9000:9000"
      - "8812:8812"
      - "9009:9009"
    networks:
      - nextick_net
    volumes:
      - ./data/questdb:/var/lib/questdb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9000/exec?query=select%201' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  data-producer:
    build: .
    container_name: nextick-data-producer
    command: python -m data_pipeline.producer.binance_producer
    env_file:
      - data_pipeline/.env
    environment:
      - KAFKA_BROKER=kafka:29092
      - KAFKA_SERVER=kafka:29092
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - nextick_net
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  data-backfill:
    build: .
    container_name: nextick-data-backfill
    command: >
      bash -c "
      echo 'Waiting for QuestDB to be ready...';
      while ! python -c 'import socket; socket.create_connection((\"questdb\", 8812))' 2>/dev/null; do
        sleep 2;
      done;
      echo 'QuestDB is ready! Running startup candle backfill...';
      python -m data_pipeline.backfill.runner
      "
    env_file:
      - data_pipeline/.env
    environment:
      - KAFKA_BROKER=kafka:29092
      - KAFKA_SERVER=kafka:29092
      - QUESTDB_HOST=questdb
      - STARTUP_BACKFILL_STATE_FILE=/tmp/nextick/startup-backfill.json
      - STARTUP_RECONCILE_ENABLED=true
      - STARTUP_RECONCILE_REQUIRED=true
      - STARTUP_RECONCILE_MAX_ATTEMPTS=3
      - STARTUP_RECONCILE_RETRY_DELAY_SECONDS=5
      - STARTUP_RECONCILE_WINDOW_HOURS=24
      - STARTUP_RECONCILE_END_LAG_MINUTES=2
    networks:
      - nextick_net
    volumes:
      - pipeline_state:/tmp/nextick
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      questdb:
        condition: service_healthy
    restart: "no"

  data-processor:
    build: .
    container_name: nextick-data-processor
    command: >
      bash -c "
      echo 'Waiting for QuestDB to be ready...';
      while ! python -c 'import socket; socket.create_connection((\"questdb\", 8812))' 2>/dev/null; do
        sleep 2;
      done;
      echo 'QuestDB is ready! Starting realtime candle processor...';
      python -m data_pipeline.processor.runner
      "
    env_file:
      - data_pipeline/.env
    environment:
      - KAFKA_BROKER=kafka:29092
      - KAFKA_SERVER=kafka:29092
      - KAFKA_CONSUMER_GROUP_ID=candle-processor-group
      - KAFKA_AUTO_OFFSET_RESET=earliest
      - QUESTDB_HOST=questdb
      - PROCESSOR_READY_FILE=/tmp/nextick/processor-ready
      - STARTUP_BACKFILL_STATE_FILE=/tmp/nextick/startup-backfill.json
    networks:
      - nextick_net
    volumes:
      - pipeline_state:/tmp/nextick
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      questdb:
        condition: service_healthy
      data-backfill:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/nextick/processor-ready"]
      interval: 5s
      timeout: 3s
      retries: 240
      start_period: 10s
    restart: unless-stopped

networks:
  nextick_net:
    driver: bridge

volumes:
  kafka_data:
  pipeline_state:
